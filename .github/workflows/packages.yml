name: packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "!packages/pins.json"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Small packages go through the Cloudflare tunnel; anything over its 100 MB
      # upload cap goes straight to nest over NetBird, joined only when needed.
      - name: Log in to Attic
        run: |
          nix profile install nixpkgs#attic-client
          attic login home https://cache.bresilla.com "${{ secrets.ATTIC_TOKEN }}"
          attic login nest http://100.68.104.113:8080 "${{ secrets.ATTIC_TOKEN }}"
      # Machines read packages/pins.json; record whatever was built and pushed.
      - name: Build and push every package
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          join_netbird() {
            curl -fsSL https://pkgs.netbird.io/install.sh | sh
            sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" \
              --hostname "ci-${{ matrix.system }}-${{ github.run_id }}"
            for i in $(seq 30); do curl -fs -o /dev/null http://100.68.104.113:8080/ && return 0; sleep 2; done
            echo "nest is not reachable over NetBird" >&2; return 1
          }
          # Largest path in the closure that cache.nixos.org doesn't sign, so Attic would upload it.
          largest() {
            nix path-info -r --json "$1" | jq '(if type == "object" then [.[]] else . end)
              | map(select((.signatures // []) | map(startswith("cache.nixos.org-1:")) | any | not) | .narSize)
              | max // 0'
          }
          names=$(nix eval --raw ./packages#packages.${{ matrix.system }} \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)')
          echo '{}' > pins.json
          joined=
          for name in $names; do
            out=$(nix build --no-link --print-out-paths "./packages#$name")
            if [ "$(largest "$out")" -gt 95000000 ]; then
              [ -n "$joined" ] || { join_netbird; joined=1; }
              attic push nest:bresilla "$out"
            else
              attic push home:bresilla "$out"
            fi
            jq --arg n "$name" --arg p "$out" '.[$n] = $p' pins.json > pins.next && mv pins.next pins.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pins-${{ matrix.system }}
          path: pins.json
      - name: Leave NetBird
        if: always()
        run: sudo netbird down 2>/dev/null || true

  pins:
    needs: build
    # A failed architecture keeps its previous pins instead of blocking the other.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pins-*
          path: pins
      - name: Commit pins
        run: |
          [ -f packages/pins.json ] || echo '{}' > packages/pins.json
          for dir in pins/pins-*; do
            [ -f "$dir/pins.json" ] || continue
            system="${dir#pins/pins-}"
            jq --arg s "$system" --slurpfile new "$dir/pins.json" '.[$s] = $new[0]' \
              packages/pins.json > pins.next && mv pins.next packages/pins.json
          done
          git diff --quiet packages/pins.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(packages): update pins" packages/pins.json
          git pull --rebase && git push
