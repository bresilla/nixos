name: packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "!packages/pins.json"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Unchanged packages download from the caches instead of compiling again.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/packages https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = packages:xPzXK5L3tv3hfJvrfzbtQcgB//M29aqQl4uUWfn+MCw= bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      # Machines read packages/pins.json; record whatever was built.
      - name: Build every package
        id: build
        run: |
          names=$(nix eval --raw ./packages#packages.${{ matrix.system }} \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)')
          echo '{}' > pins.json
          for name in $names; do
            out=$(nix build --no-link --print-out-paths "./packages#$name")
            echo "$out" >> "$RUNNER_TEMP/paths"
            jq --arg n "$name" --arg p "$out" '.[$n] = $p' pins.json > pins.next && mv pins.next pins.json
          done
          { echo 'paths<<EOF'; cat "$RUNNER_TEMP/paths"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/attic-push
        with:
          cache: packages
          paths: ${{ steps.build.outputs.paths }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: pins-${{ matrix.system }}
          path: pins.json

  pins:
    needs: build
    # A failed architecture keeps its previous pins instead of blocking the other.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pins-*
          path: pins
      - name: Commit pins
        run: |
          [ -f packages/pins.json ] || echo '{}' > packages/pins.json
          for dir in pins/pins-*; do
            [ -f "$dir/pins.json" ] || continue
            system="${dir#pins/pins-}"
            jq --arg s "$system" --slurpfile new "$dir/pins.json" '.[$s] = $new[0]' \
              packages/pins.json > pins.next && mv pins.next packages/pins.json
          done
          git diff --quiet packages/pins.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(packages): update pins" packages/pins.json
          git pull --rebase && git push
