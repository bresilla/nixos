name: packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "!packages/pins.json"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Through the Cloudflare tunnel, which caps each upload at 100 MB.
      - name: Log in to Attic
        run: |
          nix profile install nixpkgs#attic-client
          attic login home https://cache.bresilla.com "${{ secrets.ATTIC_TOKEN }}"
      # Machines read packages/pins.json; record whatever was built and pushed.
      - name: Build and push every package
        run: |
          names=$(nix eval --raw ./packages#packages.${{ matrix.system }} \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)')
          echo '{}' > pins.json
          for name in $names; do
            out=$(nix build --no-link --print-out-paths "./packages#$name")
            attic push home:bresilla "$out"
            jq --arg n "$name" --arg p "$out" '.[$n] = $p' pins.json > pins.next && mv pins.next pins.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pins-${{ matrix.system }}
          path: pins.json

  pins:
    needs: build
    # A failed architecture keeps its previous pins instead of blocking the other.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pins-*
          path: pins
      - name: Commit pins
        run: |
          [ -f packages/pins.json ] || echo '{}' > packages/pins.json
          for dir in pins/pins-*; do
            [ -f "$dir/pins.json" ] || continue
            system="${dir#pins/pins-}"
            jq --arg s "$system" --slurpfile new "$dir/pins.json" '.[$s] = $new[0]' \
              packages/pins.json > pins.next && mv pins.next packages/pins.json
          done
          git diff --quiet packages/pins.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(packages): update pins" packages/pins.json
          git pull --rebase && git push
