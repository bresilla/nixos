# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
# Skills live in their own repository (bresilla/skills on git.bresilla.com), cloned
# outside ~/.dot; `skillshare pull` updates it and links it into every agent.
sources:
  skills: ~/.local/share/skillshare/skills
  agents: ~/.config/skillshare/agents
mode: merge
targets:
  claude:
    skills:
      path: ~/.claude/skills
  codex:
    skills:
      path: ~/.codex/skills
  universal:
    skills:
      path: ~/.agents/skills
gitea_hosts:
  - git.bresilla.com
ignore:
  - '**/.DS_Store'
  - '**/.git/**'
  - 'skillshare-hub.json'
audit:
  block_threshold: CRITICAL
