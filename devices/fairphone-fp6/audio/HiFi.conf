# Routing for the FP6's AW88261 speakers and WCD9378 microphone codec.
# Routing follows Catcrafts/alsa-ucm-conf, fp6 commit b57f2a06ac70.
# Microphone gain is calibrated on the handset.
SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='SEN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
}

SectionDevice."Mic" {
	Comment "Handset microphone (bottom edge)"
	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		# 30 dB analogue gain and 6 dB digital gain, checked on the handset.
		cset "name='ADC1 Volume' 20"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX0 SEQUENCER Switch' 1"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_DEC0 Volume' 90"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX0 SEQUENCER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"
	EnableSequence [
		cset "name='Amplifier L PCM Playback Volume' 352"
		cset "name='Amplifier R PCM Playback Volume' 352"
	]
	DisableSequence [
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier R PCM Playback Volume' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
